name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  node:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        node: [22, 24]
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - name: plugin tests
        working-directory: plugin
        run: npm test
      - name: tools tests
        run: node --test tools/*.test.mjs
      - name: extension tests
        run: node --test async-question-host/*.test.mjs tasks-host/*.test.mjs recovery-host/*.test.mjs files-host/*.test.mjs screenshot-host/*.test.mjs suggestions-host/*.test.mjs antigravity-cli-host/*.test.mjs voice-extension/test/*.test.mjs market-extension/*.test.mjs
      - name: release privacy gate
        run: node tools/check-release.mjs

  android-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Android fullscreen lifecycle (host stubs, not device acceptance)
        run: python3 android/test/fullscreen-lifecycle.py
      - name: Android download policy
        run: |
          javac -encoding UTF-8 -d "$RUNNER_TEMP/download-policy" android/src/com/agenthub/dsh/DownloadPolicy.java android/test/DownloadPolicyTest.java
          java -cp "$RUNNER_TEMP/download-policy" com.agenthub.dsh.DownloadPolicyTest
