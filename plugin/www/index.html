<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1014" media="(prefers-color-scheme: dark)">
<meta name="format-detection" content="telephone=no">
<title>DSH</title>
<link rel="icon" href="/m/icon-192.png">
<link rel="manifest" href="/m/manifest.webmanifest">
<link rel="apple-touch-icon" href="/m/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="DSH">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<!--CSS-->
</head>
<body>
<div id="app">
  <section id="home" class="page on" aria-label="对话列表">
    <header class="bar">
      <div class="brand"><span class="logo">DSH</span><span id="status" class="status"><i></i><em></em></span></div>
      <a class="market-entry" href="/m/market.html?v=20261012-2" aria-label="打开插件市场">插件</a>
      <button id="btnSearch" class="ib" data-ic="search" aria-label="搜索"></button>
      <button id="btnSettings" class="ib" data-ic="settings" aria-label="设置" title="设置"></button>
    </header>
    <div id="searchBox" class="searchbox" hidden>
      <span data-ic="search"></span><input id="q" type="search" placeholder="搜索对话标题" enterkeyhint="search" autocomplete="off"><button id="qClose" class="link">取消</button>
    </div>
    <nav id="chips" class="chips" aria-label="工作区"></nav>
    <div id="list" class="scroll list">
      <div id="ptr" class="ptr"><span data-ic="refresh"></span></div>
      <div id="rows"></div>
    </div>
    <button id="fab" class="fab" data-ic="plus" aria-label="新对话"></button>
  </section>

  <section id="chat" class="page" aria-label="对话">
    <header class="bar">
      <button id="back" class="ib" data-ic="back" aria-label="返回"></button>
      <button id="head" class="ttl"><b id="cTitle"></b><small id="cSub"></small></button>
      <button id="host" class="host-ib" aria-label="切换电脑" hidden></button>
      <button id="more" class="ib" data-ic="more" aria-label="更多"></button>
    </header>
    <div id="scroller" class="scroll">
      <div id="older"></div>
      <div id="msgs" class="msgs"></div>
      <div id="tail" class="msgs"></div>
    </div>
    <button id="toBottom" class="tobottom" data-ic="down" aria-label="回到底部" hidden></button>
    <div id="dock" class="dock"></div>
    <footer class="composer">
      <div id="thumbs" class="thumbs" hidden></div>
      <div class="crow">
        <button id="attach" class="ib" data-ic="image" aria-label="添加图片"></button>
        <button id="quick" class="ib" data-ic="zap" aria-label="快捷指令"></button>
        <button id="mic" class="ib" data-ic="mic" aria-label="语音输入"></button>
        <button id="voiceKeyboard" class="ib voice-keyboard" aria-label="切回键盘" hidden>⌨</button><button id="holdTalk" class="hold-talk" hidden>按住说话</button>
        <div id="inputWrap" class="input-wrap"><textarea id="input" rows="1" placeholder="发消息给 DSH" enterkeyhint="enter"></textarea><button id="inputSuggestion" class="input-suggestion" aria-label="采用输入建议" hidden></button></div>
        <button id="send" class="send" aria-label="发送"></button>
      </div>
      <div id="holdHint" class="hold-hint" role="status" hidden></div>
      <button id="voiceRetryReplies" class="link" hidden>重试保存回复</button>
      <div id="voiceBar" class="voice-bar" hidden><span id="voiceState" role="status"></span><button id="voiceFinish" class="link">结束录音</button><button id="voiceEnd" class="link">退出</button><span id="voiceCaption" aria-live="polite" style="flex-basis:100%;white-space:pre-wrap;max-height:6em;overflow:auto"></span></div>
      <button id="permission" class="permission" aria-label="切换权限" aria-haspopup="dialog" hidden></button>
      <input id="file" type="file" accept="image/*" multiple hidden>
    </footer>
  </section>

  <div id="sheetWrap" class="sheet-wrap" hidden>
    <div class="backdrop"></div>
    <div id="sheet" class="sheet" role="dialog"></div>
  </div>
  <div id="fv" class="fv" hidden>
    <header class="bar">
      <button id="fvBack" class="ib" data-ic="back" aria-label="返回"></button>
      <div class="ttl"><b id="fvTitle"></b><small id="fvSub"></small></div>
      <button id="fvAct" class="ib" data-ic="copy" aria-label="复制全文" hidden></button>
    </header>
    <div id="fvBody" class="scroll fvb"></div>
  </div>
  <div id="viewer" class="viewer" hidden><img alt=""></div>
  <section id="callPanel" class="call-panel" role="dialog" aria-label="与 DSH 语音通话" hidden><div class="call-avatar">DSH</div><h2>语音通话</h2><time id="callClock">00:00</time><p id="callState" role="status">正在接通…</p><div id="callCaption" class="call-caption" aria-live="polite"></div><div class="call-actions"><button id="callMute" aria-pressed="false">静音</button><button id="callInterrupt">打断并说</button><button id="callHangup" class="hangup">挂断</button></div></section>
  <div id="toast" class="toast" role="status"></div>
</div>
<!-- folder-picker.js/css are concatenated into the existing hashed assets by the server. -->
<!--JS-->
</body>
</html>
